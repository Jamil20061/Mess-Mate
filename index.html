<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess-Mate Test</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial;
      background:#f3f6fb;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 5px 25px #0001;
      max-width:350px;
    }

    h1{
      color:#2563eb;
    }

    #status{
      margin-top:15px;
      line-height:1.6;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Mess-Mate</h1>

  <div id="status">
    Checking GitHub Pages...
  </div>

</div>


<script>

setTimeout(function(){

  document.getElementById("status").innerHTML =
    "✅ GitHub Pages is working.<br><br>" +
    "Now checking Firebase...";

},1000);

</script>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


const firebaseConfig = {
  apiKey: "AIzaSyC1co4VUZoqTJAJnmprEjYE9FJ3kFx6YJo",
  authDomain: "mess-mate-2942b.firebaseapp.com",
  projectId: "mess-mate-2942b",
  storageBucket: "mess-mate-2942b.firebasestorage.app",
  messagingSenderId: "661215494906",
  appId: "1:661215494906:web:6b4eb1d938fb7bba11ff43"
};


try{

  initializeApp(firebaseConfig);

  document.getElementById("status").innerHTML =
    "✅ GitHub Pages is working.<br><br>" +
    "✅ Firebase is loading correctly.<br><br>" +
    "<b>Test successful.</b>";

}catch(error){

  document.getElementById("status").innerHTML =
    "❌ Firebase error:<br><br>" +
    error.message;

}

</script>


<script>

setTimeout(function(){

  const status =
    document.getElementById("status");

  if(
    status.innerText.includes(
      "checking Firebase"
    )
  ){

    status.innerHTML =
      "❌ Firebase JavaScript module did not load.<br><br>" +
      "The problem is probably CDN / browser / network.";

  }

},6000);

</script>

</body>
</html>
