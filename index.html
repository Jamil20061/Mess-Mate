<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess-Mate Test</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f3f6fb;
  font-family:Arial;
}
.box{
  background:white;
  padding:30px 20px;
  border-radius:20px;
  width:85%;
  max-width:400px;
  text-align:center;
  box-shadow:0 8px 30px #0001;
}
h1{color:#2563eb}
#status{
  margin-top:20px;
  line-height:1.8;
}
</style>
</head>

<body>

<div class="box">

<h1>Mess-Mate</h1>

<div id="status">
Checking Firebase...
</div>

</div>


<!-- Firebase -->

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>


<script>

const status =
document.getElementById("status");


const firebaseConfig = {

apiKey:
"AIzaSyC1co4VUZoqTJAJnmprEjYE9FJ3kFx6YJo",

authDomain:
"mess-mate-2942b.firebaseapp.com",

projectId:
"mess-mate-2942b",

storageBucket:
"mess-mate-2942b.firebasestorage.app",

messagingSenderId:
"661215494906",

appId:
"1:661215494906:web:6b4eb1d938fb7bba11ff43"

};


let app;
let auth;
let db;


try{

firebase.initializeApp(firebaseConfig);

auth=firebase.auth();

db=firebase.firestore();


status.innerHTML=
"✅ Firebase initialized<br><br>"+
"Testing Firestore...";


/* FIRESTORE TEST */

const testRef=
db.collection("users")
.doc("firebase_test_connection");


const timeout=
new Promise((resolve,reject)=>{

setTimeout(()=>{

reject(
new Error(
"Firestore request timed out after 8 seconds."
)
);

},8000);

});


Promise.race([

testRef.get(),

timeout

])

.then(snapshot=>{

status.innerHTML=
"✅ Firebase initialized<br><br>"+
"✅ Firestore connected successfully.<br><br>"+
"<b>Database is working.</b>";

})

.catch(error=>{

console.error(error);

status.innerHTML=
"❌ Firestore problem<br><br>"+
"<small>"+
(error.message||error)+
"</small>";

});


}catch(error){

console.error(error);

status.innerHTML=
"❌ Firebase initialization error<br><br>"+
"<small>"+
(error.message||error)+
"</small>";

}

</script>

</body>
</html>
