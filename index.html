<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Mess-Mate</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#loading{
  position:fixed;inset:0;z-index:99999;
  background:#f3f6fb;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;padding:25px
}
.loader{
  width:45px;height:45px;border:4px solid #dbe5f5;
  border-top-color:#2563eb;border-radius:50%;
  animation:spin .8s linear infinite;margin-bottom:16px
}
@keyframes spin{to{transform:rotate(360deg)}}

.topbar{
  position:sticky;top:0;z-index:1000;
  background:#fff;border-bottom:1px solid #e6eaf0;
  padding:12px 15px;display:flex;
  justify-content:space-between;align-items:center
}
.logo{
  display:flex;align-items:center;gap:10px
}
.logoIcon{
  width:40px;height:40px;border-radius:13px;
  background:#2563eb;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:900
}
.logoText b{font-size:18px}
.logoText small{display:block;color:#8992a3;font-size:10px;margin-top:2px}
.avatar{
  width:40px;height:40px;border:0;border-radius:50%;
  background:#e8efff;color:#2563eb;font-weight:900
}

.container{
  max-width:850px;margin:auto;
  padding:17px 14px 95px
}
.card{
  background:#fff;border:1px solid #edf0f5;
  border-radius:18px;padding:17px;margin-bottom:14px;
  box-shadow:0 4px 18px #1930500b
}
.title{
  font-size:17px;font-weight:800;margin-bottom:13px
}
.muted{color:#7b8495;font-size:13px;line-height:1.5}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f8cff);
  color:#fff;border-radius:22px;padding:22px 18px;
  margin-bottom:14px
}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{font-size:13px;opacity:.9}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stat{
  background:#f8faff;border:1px solid #edf1f8;
  border-radius:14px;padding:14px
}
.stat small{display:block;color:#7b8495;font-size:11px;margin-bottom:7px}
.stat b{font-size:20px}

input,select,textarea{
  width:100%;padding:12px;border:1px solid #dce2eb;
  border-radius:12px;outline:none;background:#fff;color:#172033
}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:#2563eb;box-shadow:0 0 0 3px #2563eb12
}
.form{margin-bottom:13px}
.form label{
  display:block;font-size:12px;font-weight:700;margin-bottom:6px
}

.btn{
  border:0;border-radius:12px;padding:11px 14px;
  font-weight:700
}
.primary{background:#2563eb;color:#fff}
.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}
.warning{background:#f59e0b;color:#fff}
.secondary{background:#edf2f8;color:#344054}
.full{width:100%}

.row{
  display:flex;gap:8px;align-items:center;
  flex-wrap:wrap
}
.between{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px
}

.auth{
  max-width:430px;margin:45px auto
}
.bigLogo{
  width:70px;height:70px;border-radius:22px;
  background:#2563eb;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;margin:0 auto 15px
}
.auth h1{text-align:center;font-size:28px}
.auth>p{text-align:center;color:#8992a3;font-size:13px;margin:6px 0 20px}

.tabs{
  display:flex;background:#edf2f8;padding:4px;
  border-radius:12px;margin-bottom:17px
}
.tab{
  flex:1;border:0;background:transparent;
  padding:10px;border-radius:9px;font-weight:700;color:#667085
}
.tab.active{
  background:#fff;color:#2563eb;
  box-shadow:0 2px 7px #0000000d
}

.messName{font-size:22px;font-weight:900}
.badge{
  display:inline-block;padding:4px 8px;border-radius:20px;
  background:#e8efff;color:#2563eb;font-size:10px;
  font-weight:800;margin-top:5px
}

.member{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5
}
.member:last-child{border-bottom:0}
.memberLeft{display:flex;align-items:center;gap:10px;min-width:0}
.memberAvatar{
  width:42px;height:42px;border-radius:50%;
  background:#e8efff;color:#2563eb;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;flex-shrink:0
}
.memberInfo{min-width:0}
.memberName{font-size:14px;font-weight:800}
.memberEmail{
  color:#8992a3;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:180px;margin-top:2px
}
.role{
  display:inline-block;margin-top:4px;
  padding:3px 7px;border-radius:20px;
  background:#edf2f8;color:#667085;
  font-size:9px;font-weight:800
}
.role.admin{background:#e8efff;color:#2563eb}
.memberActions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:7px 9px;border:0;border-radius:8px;font-size:10px;font-weight:800}

.request{
  background:#f8faff;border-radius:13px;padding:12px;
  margin-bottom:9px
}
.request:last-child{margin-bottom:0}

.invite{
  background:#f5f8ff;border:1px dashed #9db9f8;
  border-radius:14px;padding:14px
}
.code{
  color:#2563eb;font-size:24px;font-weight:900;
  letter-spacing:4px;margin:7px 0 11px
}

.transaction{
  padding:12px 0;border-bottom:1px solid #edf0f5
}
.transaction:last-child{border-bottom:0}
.transaction b{font-size:14px}
.amount{font-weight:900;color:#16a34a}
.amount.expense{color:#dc2626}

.notice{
  background:#fff8e8;border:1px solid #f5df9c;
  border-radius:13px;padding:12px;margin-bottom:9px
}
.notice:last-child{margin-bottom:0}
.notice b{font-size:14px}
.notice small{display:block;color:#92752e;margin-top:5px}

.mealBtn{
  padding:14px 7px;border:2px solid #e5eaf2;
  border-radius:14px;background:#fff;
  font-weight:800;color:#667085
}
.mealBtn.on{
  border-color:#16a34a;background:#ecfdf3;color:#16a34a
}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:999;
  background:#fff;border-top:1px solid #e5eaf2
}
.bottomInner{
  max-width:850px;margin:auto;
  display:grid;grid-template-columns:repeat(5,1fr)
}
.nav{
  border:0;background:transparent;color:#8992a3;
  padding:8px 3px;font-size:10px;font-weight:700
}
.nav span{display:block;font-size:19px;margin-bottom:2px}
.nav.active{color:#2563eb}

.section{display:none}
.section.active{display:block}

.toast{
  position:fixed;left:50%;bottom:80px;
  transform:translateX(-50%) translateY(20px);
  background:#172033;color:#fff;padding:11px 16px;
  border-radius:12px;font-size:12px;
  opacity:0;pointer-events:none;z-index:100000;
  transition:.25s;max-width:90%;text-align:center
}
.toast.show{
  opacity:1;transform:translateX(-50%) translateY(0)
}

.empty{text-align:center;padding:22px;color:#8992a3;font-size:13px}

.dark body{}
body.dark{background:#111827;color:#f1f5f9}
body.dark .card,
body.dark .topbar,
body.dark .bottom,
body.dark input,
body.dark select,
body.dark textarea{
  background:#1f2937;color:#f1f5f9;border-color:#374151
}
body.dark .stat,
body.dark .memberAvatar,
body.dark .invite,
body.dark .request{
  background:#263244;border-color:#374151
}
body.dark .muted,
body.dark .memberEmail,
body.dark .stat small{color:#aab4c3}
body.dark .secondary{background:#374151;color:#fff}
body.dark .mealBtn{background:#1f2937;color:#cbd5e1;border-color:#374151}
body.dark .tabs{background:#374151}
body.dark .tab.active{background:#1f2937}
body.dark .transaction,
body.dark .member{border-color:#374151}

@media(max-width:420px){
  .grid3{grid-template-columns:1fr 1fr}
}
</style>
</head>
