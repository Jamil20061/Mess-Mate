<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mess-Mate</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#f3f6fb;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:85%;
  max-width:400px;
  background:white;
  padding:25px 20px;
  border-radius:22px;
  box-shadow:0 8px 30px #0001;
}

.logo{
  width:65px;
  height:65px;
  border-radius:20px;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin:0 auto 15px;
}

h1{
  text-align:center;
  color:#2563eb;
  margin:0;
}

.sub{
  text-align:center;
  color:#888;
  font-size:13px;
  margin:7px 0 22px;
}

input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:15px;
}

#status{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#777;
  line-height:1.5;
}
</style>

</head>

<body>

<div class="card">

  <div class="logo">
    M
  </div>

  <h1>Mess-Mate</h1>

  <div class="sub">
    Smart Mess Management
  </div>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <div id="status">
    Connecting to Firebase...
  </div>

</div>


<!-- Firebase -->

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
  "AIzaSyC1co4VUZoqTJAJnmprEjYE9FJ3kFx6YJo",

  authDomain:
  "mess-mate-2942b.firebaseapp.com",

  projectId:
  "mess-mate-2942b",

  storageBucket:
  "mess-mate-2942b.firebasestorage.app",

  messagingSenderId:
  "661215494906",

  appId:
  "1:661215494906:web:6b4eb1d938fb7bba11ff43"

};


try{

  firebase.initializeApp(firebaseConfig);

  const auth =
    firebase.auth();


  document.getElementById("status").innerHTML =
    "✅ Firebase connected.<br>" +
    "Login system ready.";


  auth.onAuthStateChanged(function(user){

    if(user){

      document.getElementById("status").innerHTML =
        "✅ Logged in as:<br>" +
        user.email;

    }

  });


  window.login = async function(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if(!email || !password){

      document.getElementById("status").innerHTML =
        "Please enter email and password.";

      return;

    }


    document.getElementById("status").innerHTML =
      "Logging in...";


    try{

      await auth.signInWithEmailAndPassword(
        email,
        password
      );


      document.getElementById("status").innerHTML =
        "✅ Login successful!";


    }catch(error){

      console.error(error);

      document.getElementById("status").innerHTML =
        "❌ "+error.message;

    }

  };


}catch(error){

  document.getElementById("status").innerHTML =
    "❌ Firebase error:<br>"+
    error.message;

}

</script>

</body>
</html>
